<svg xmlns="http://www.w3.org/2000/svg" width="512" height="658" viewBox="0 0 512 658">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="#ffffff" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- عصا المكنسة -->
    <line x1="352" y1="96" x2="236" y2="330" stroke-width="26"/>
    <!-- رأس المكنسة -->
    <path d="M206 316 L282 352 L262 392 L186 356 Z" stroke-width="10"/>
    <path d="M186 356 L262 392 L222 468 L120 420 Z" stroke-width="10"/>
    <g stroke="#1a1a1a" stroke-width="8" fill="none">
      <line x1="196" y1="380" x2="160" y2="436"/>
      <line x1="220" y1="392" x2="186" y2="448"/>
      <line x1="244" y1="402" x2="212" y2="458"/>
    </g>
    <!-- غبار -->
    <circle cx="330" cy="440" r="14" stroke="none"/>
    <circle cx="372" cy="414" r="10" stroke="none"/>
    <circle cx="364" cy="460" r="8" stroke="none"/>
  </g>
  <text x="256" y="600" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="82" font-weight="bold" fill="#ffffff" filter="url(#glow)">الخدمات</text>
</svg>
